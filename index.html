<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Recall Learning — Jay Lee</title>
    <style>
/* ── Recall Learning — dark-friendly, mobile-first ── */
:root {
  --bg: #0f1117;
  --bg-elevated: #1a1d27;
  --bg-card: #222633;
  --bg-hover: #2a2f3d;
  --border: #2e3345;
  --text: #e8eaed;
  --text-muted: #9aa0b0;
  --text-dim: #6b7280;
  --accent: #6c8cff;
  --accent-hover: #8aa4ff;
  --accent-soft: rgba(108, 140, 255, 0.15);
  --success: #34d399;
  --success-soft: rgba(52, 211, 153, 0.15);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.15);
  --warning: #fbbf24;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
  --transition: 0.2s ease;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5f6fa;
    --bg-elevated: #ffffff;
    --bg-card: #ffffff;
    --bg-hover: #f0f1f5;
    --border: #e2e4ec;
    --text: #1a1d27;
    --text-muted: #5c6378;
    --text-dim: #8b90a0;
    --accent: #4f6ef7;
    --accent-hover: #3b5de7;
    --accent-soft: rgba(79, 110, 247, 0.12);
    --success: #059669;
    --success-soft: rgba(5, 150, 105, 0.12);
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, 0.1);
    --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

a {
  color: var(--accent);
}

/* ── Layout ── */
.app {
  max-width: 720px;
  margin: 0 auto;
  padding: 1rem 1rem 3rem;
}

.header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 1rem 0 1.25rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.25rem;
}

.header h1 {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.header h1 span {
  color: var(--accent);
}

.header-meta {
  font-size: 0.8rem;
  color: var(--text-dim);
}

/* ── Nav tabs ── */
.nav {
  display: flex;
  gap: 0.35rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.3rem;
  margin-bottom: 1.25rem;
}

.nav-btn {
  flex: 1;
  padding: 0.55rem 0.75rem;
  border-radius: var(--radius-sm);
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--text-muted);
  transition: background var(--transition), color var(--transition);
}

.nav-btn:hover {
  color: var(--text);
  background: var(--bg-hover);
}

.nav-btn.active {
  background: var(--accent);
  color: #fff;
}

/* ── Topic chips ── */
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  margin-bottom: 1.25rem;
}

.chip {
  padding: 0.35rem 0.75rem;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 550;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-muted);
  transition: all var(--transition);
}

.chip:hover {
  border-color: var(--accent);
  color: var(--text);
}

.chip.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent-hover);
}

/* ── Views ── */
.view {
  display: none;
}

.view.active {
  display: block;
}

/* ── Progress bar strip ── */
.progress-strip {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-bottom: 1rem;
}

.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
}

.progress-bar > span {
  display: block;
  height: 100%;
  background: var(--success);
  border-radius: 999px;
  transition: width 0.35s ease;
}

/* ── Flashcards ── */
.card-stage {
  perspective: 1000px;
  margin-bottom: 1.25rem;
}

.flashcard {
  position: relative;
  width: 100%;
  min-height: 240px;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform 0.5s ease;
}

.flashcard.flipped {
  transform: rotateY(180deg);
}

.flashcard-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-card);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.75rem 1.5rem;
  text-align: center;
}

.flashcard-face.back {
  transform: rotateY(180deg);
  background: linear-gradient(145deg, var(--bg-card), var(--bg-elevated));
}

.face-label {
  font-size: 0.7rem;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-dim);
  margin-bottom: 0.75rem;
}

.face-topic {
  font-size: 0.72rem;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.face-text {
  font-size: 1.1rem;
  font-weight: 600;
  line-height: 1.45;
  max-width: 90%;
}

.flashcard-face.back .face-text {
  font-size: 0.95rem;
  font-weight: 450;
  color: var(--text-muted);
}

.tap-hint {
  margin-top: 1rem;
  font-size: 0.72rem;
  color: var(--text-dim);
}

.card-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: center;
  margin-bottom: 0.75rem;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
  padding: 0.55rem 1rem;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  transition: all var(--transition);
}

.btn:hover {
  background: var(--bg-hover);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn-primary:hover {
  background: var(--accent-hover);
}

.btn-success {
  background: var(--success-soft);
  border-color: var(--success);
  color: var(--success);
}

.btn-danger {
  background: var(--danger-soft);
  border-color: var(--danger);
  color: var(--danger);
}

.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--text-muted);
}

.btn-ghost:hover {
  color: var(--text);
  background: var(--bg-hover);
}

.card-meta {
  text-align: center;
  font-size: 0.8rem;
  color: var(--text-dim);
}

.known-badge {
  display: inline-block;
  margin-left: 0.4rem;
  padding: 0.1rem 0.45rem;
  border-radius: 999px;
  font-size: 0.68rem;
  font-weight: 650;
  background: var(--success-soft);
  color: var(--success);
}

/* ── Quiz ── */
.quiz-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 1rem;
  font-size: 0.85rem;
  color: var(--text-muted);
}

.quiz-score {
  font-weight: 700;
  color: var(--accent);
}

.quiz-question-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.5rem;
  box-shadow: var(--shadow);
  margin-bottom: 1rem;
}

.quiz-topic {
  font-size: 0.72rem;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.quiz-question {
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 1.25rem;
  line-height: 1.45;
}

.quiz-options {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.quiz-option {
  text-align: left;
  padding: 0.85rem 1rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  font-size: 0.9rem;
  transition: all var(--transition);
}

.quiz-option:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.quiz-option.correct {
  border-color: var(--success);
  background: var(--success-soft);
  color: var(--success);
}

.quiz-option.wrong {
  border-color: var(--danger);
  background: var(--danger-soft);
  color: var(--danger);
}

.quiz-option:disabled {
  cursor: default;
}

.quiz-explanation {
  margin-top: 1rem;
  padding: 0.85rem 1rem;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  font-size: 0.85rem;
  color: var(--text-muted);
  display: none;
}

.quiz-explanation.visible {
  display: block;
}

.quiz-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  justify-content: center;
}

.quiz-done {
  text-align: center;
  padding: 2rem 1rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.quiz-done h2 {
  font-size: 1.4rem;
  margin-bottom: 0.5rem;
}

.quiz-done .big-score {
  font-size: 2.5rem;
  font-weight: 800;
  color: var(--accent);
  margin: 0.75rem 0;
}

.quiz-done .best {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 1.25rem;
}

/* ── Concepts browse ── */
.concept-grid {
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

.concept-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem 1.35rem;
  transition: border-color var(--transition);
}

.concept-card:hover {
  border-color: var(--accent);
}

.concept-card h3 {
  font-size: 1.05rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
}

.concept-card p {
  font-size: 0.875rem;
  color: var(--text-muted);
  margin-bottom: 0.85rem;
}

.concept-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  font-size: 0.75rem;
  color: var(--text-dim);
}

.concept-stats span {
  padding: 0.2rem 0.55rem;
  border-radius: 999px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
}

.concept-stats .known-count {
  color: var(--success);
  border-color: var(--success);
  background: var(--success-soft);
}

.empty-state {
  text-align: center;
  padding: 2.5rem 1rem;
  color: var(--text-dim);
  font-size: 0.9rem;
}

/* ── Footer ── */
.footer {
  margin-top: 2.5rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
  text-align: center;
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* ── Responsive ── */
@media (max-width: 480px) {
  .app {
    padding: 0.75rem 0.75rem 2.5rem;
  }

  .header h1 {
    font-size: 1.15rem;
  }

  .flashcard {
    min-height: 200px;
  }

  .face-text {
    font-size: 1rem;
  }

  .nav-btn {
    font-size: 0.8rem;
    padding: 0.5rem 0.4rem;
  }
}

    </style>
  </head>
  <body>
    <div class="app" id="app">
      <header class="header">
        <h1>Recall <span>Learning</span></h1>
        <div class="header-meta" id="header-meta"></div>
      </header>

      <nav class="nav" aria-label="Modes">
        <button type="button" class="nav-btn active" data-view="concepts">Concepts</button>
        <button type="button" class="nav-btn" data-view="flashcards">Flashcards</button>
        <button type="button" class="nav-btn" data-view="quiz">Quiz</button>
      </nav>

      <div class="filters" id="filters" aria-label="Topic filter"></div>

      <main>
        <section class="view active" id="view-concepts" aria-label="Concepts browse"></section>
        <section class="view" id="view-flashcards" aria-label="Flashcards"></section>
        <section class="view" id="view-quiz" aria-label="Quiz"></section>
      </main>

      <footer class="footer">
        Daily play/review from Recall notes · Progress saved in this browser
      </footer>
    </div>

    <script>
/**

window.LEARNING_DATA = {

      "relatedCardTitles": [

    {
      "id": "fx-jpy",

      "nameEn": "FX / why JPY falls",

      "relatedCardTitles": [

      "relatedCardTitles": [

      "relatedCardTitles": [
        "宏觀經濟與全球債務、量化寬鬆（QE）底層邏輯",

    {

        "债务缠绕 日加息难扭圆汇弱势",

      "name": "债务与财政约束 · Debt & fiscal constraints"

    {

      "nameZh": "日本：宏观模板",

      "summary": "Bubble → balance-sheet repair → decades of low inflation and ultra-easy policy form the template. Exit attempts hinge on CPI near 2%, wage talks (春鬥), and careful normalization toward ~1.25% policy rates—with FX and JGB volatility as side constraints, not the whole objective function.",

      "summary": "Macro sets the regime; market structure (margin, credit events, listing supply, stablecoin redeemability) sets amplification. A single credit event can spike volatility without proving a recession. Keep Elliott/JK tactics on a separate track.",
      "relatedCardTitles": [],
      "name": "市场结构 vs 宏观 · Market structure vs macro"

    {
      "id": "jk-elliott",

    <script>
/**
 * Recall Learning — flashcards, quiz, concepts browse
 * Progress persisted in localStorage under key "recall-learning-progress"
 */
(function () {
  "use strict";

  const STORAGE_KEY = "recall-learning-progress";
  const data = window.LEARNING_DATA;
  if (!data || !data.topics || !data.flashcards || !data.quiz) {
    document.body.innerHTML =
      "<p style='padding:2rem;font-family:sans-serif'>Missing LEARNING_DATA. Load data.js before app.js.</p>";
    return;
  }

  /* ── State ── */
  const state = {
    view: "concepts", // concepts | flashcards | quiz
    topicFilter: "all",
    // flashcards
    fcOrder: [],
    fcIndex: 0,
    fcFlipped: false,
    // quiz
    qzOrder: [],
    qzIndex: 0,
    qzAnswered: false,
    qzSelected: null,
    qzCorrect: 0,
    qzDone: false,
  };

  /* ── Progress (localStorage) ── */
  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const p = JSON.parse(raw);
        return {
          knownCards: Array.isArray(p.knownCards) ? p.knownCards : [],
          quizBest: typeof p.quizBest === "object" && p.quizBest ? p.quizBest : {},
        };
      }
    } catch (_) {}
    return { knownCards: [], quizBest: {} };
  }

  function saveProgress(progress) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    } catch (_) {}
  }

  let progress = loadProgress();

  function isKnown(id) {
    return progress.knownCards.includes(id);
  }

  function setKnown(id, known) {
    const set = new Set(progress.knownCards);
    if (known) set.add(id);
    else set.delete(id);
    progress.knownCards = [...set];
    saveProgress(progress);
  }

  function quizBestKey(filter) {
    return filter || "all";
  }

  function getQuizBest(filter) {
    return progress.quizBest[quizBestKey(filter)] || 0;
  }

  function setQuizBest(filter, score) {
    const key = quizBestKey(filter);
    const prev = progress.quizBest[key] || 0;
    if (score > prev) {
      progress.quizBest[key] = score;
      saveProgress(progress);
    }
  }

  /* ── Helpers ── */
  function topicById(id) {
    return data.topics.find((t) => t.id === id);
  }

  function filteredFlashcards() {
    if (state.topicFilter === "all") return data.flashcards.slice();
    return data.flashcards.filter((c) => c.topicId === state.topicFilter);
  }

  function filteredQuiz() {
    if (state.topicFilter === "all") return data.quiz.slice();
    return data.quiz.filter((q) => q.topicId === state.topicFilter);
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function $(sel, root) {
    return (root || document).querySelector(sel);
  }

  function $$(sel, root) {
    return [...(root || document).querySelectorAll(sel)];
  }

  /* ── Init flashcard / quiz decks ── */
  function resetFlashcards(doShuffle) {
    const cards = filteredFlashcards();
    state.fcOrder = doShuffle ? shuffle(cards.map((c) => c.id)) : cards.map((c) => c.id);
    state.fcIndex = 0;
    state.fcFlipped = false;
  }

  function resetQuiz(doShuffle) {
    const qs = filteredQuiz();
    state.qzOrder = doShuffle ? shuffle(qs.map((q) => q.id)) : qs.map((q) => q.id);
    state.qzIndex = 0;
    state.qzAnswered = false;
    state.qzSelected = null;
    state.qzCorrect = 0;
    state.qzDone = false;
  }

  function currentCard() {
    const id = state.fcOrder[state.fcIndex];
    return data.flashcards.find((c) => c.id === id);
  }

  function currentQuestion() {
    const id = state.qzOrder[state.qzIndex];
    return data.quiz.find((q) => q.id === id);
  }

  /* ── Render: chips ── */
  function renderChips() {
    const el = $("#filters");
    const topics = [{ id: "all", name: "All" }, ...data.topics];
    el.innerHTML = topics
      .map(
        (t) =>
          `<button type="button" class="chip${state.topicFilter === t.id ? " active" : ""}" data-topic="${t.id}">${escapeHtml(t.name)}</button>`
      )
      .join("");
  }

  /* ── Render: concepts ── */
  function renderConcepts() {
    const el = $("#view-concepts");
    const topics =
      state.topicFilter === "all"
        ? data.topics
        : data.topics.filter((t) => t.id === state.topicFilter);

    if (!topics.length) {
      el.innerHTML = '<div class="empty-state">No topics match this filter.</div>';
      return;
    }

    el.innerHTML =
      '<div class="concept-grid">' +
      topics
        .map((t) => {
          const fc = data.flashcards.filter((c) => c.topicId === t.id);
          const qz = data.quiz.filter((q) => q.topicId === t.id);
          const known = fc.filter((c) => isKnown(c.id)).length;
          return `
          <article class="concept-card">
            <h3>${escapeHtml(t.name)}</h3>
            <p>${escapeHtml(t.summary)}</p>
            <div class="concept-stats">
              <span>${fc.length} flashcard${fc.length !== 1 ? "s" : ""}</span>
              <span>${qz.length} quiz</span>
              ${fc.length ? `<span class="known-count">${known}/${fc.length} known</span>` : ""}
            </div>
          </article>`;
        })
        .join("") +
      "</div>";
  }

  /* ── Render: flashcards ── */
  function renderFlashcards() {
    const el = $("#view-flashcards");
    const total = state.fcOrder.length;

    if (!total) {
      el.innerHTML = '<div class="empty-state">No flashcards for this topic.</div>';
      return;
    }

    const card = currentCard();
    if (!card) {
      el.innerHTML = '<div class="empty-state">Card not found.</div>';
      return;
    }

    const topic = topicById(card.topicId);
    const known = isKnown(card.id);
    const knownCount = state.fcOrder.filter((id) => isKnown(id)).length;
    const pct = Math.round((knownCount / total) * 100);

    el.innerHTML = `
      <div class="progress-strip">
        <span>${knownCount}/${total} known</span>
        <div class="progress-bar"><span style="width:${pct}%"></span></div>
      </div>
      <div class="card-stage">
        <div class="flashcard${state.fcFlipped ? " flipped" : ""}" id="flashcard" role="button" tabindex="0" aria-label="Flip card">
          <div class="flashcard-face front">
            <div class="face-label">Concept</div>
            <div class="face-topic">${escapeHtml(topic ? topic.name : "")}</div>
            <div class="face-text">${escapeHtml(card.front)}</div>
            <div class="tap-hint">Tap to flip</div>
          </div>
          <div class="flashcard-face back">
            <div class="face-label">Explanation</div>
            <div class="face-topic">${escapeHtml(topic ? topic.name : "")}</div>
            <div class="face-text">${escapeHtml(card.back)}</div>
            <div class="tap-hint">Tap to flip back</div>
          </div>
        </div>
      </div>
      <div class="card-controls">
        <button type="button" class="btn" id="fc-prev" ${state.fcIndex === 0 ? "disabled" : ""}>← Prev</button>
        <button type="button" class="btn btn-danger" id="fc-unknown">Unknown</button>
        <button type="button" class="btn btn-success" id="fc-known">Known ✓</button>
        <button type="button" class="btn" id="fc-next" ${state.fcIndex >= total - 1 ? "disabled" : ""}>Next →</button>
      </div>
      <div class="card-controls">
        <button type="button" class="btn btn-ghost" id="fc-shuffle">Shuffle</button>
        <button type="button" class="btn btn-ghost" id="fc-flip">Flip</button>
      </div>
      <div class="card-meta">
        ${state.fcIndex + 1} / ${total}
        ${known ? '<span class="known-badge">Known</span>' : ""}
      </div>`;

    $("#flashcard").addEventListener("click", flipCard);
    $("#flashcard").addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        flipCard();
      }
    });
    $("#fc-prev").addEventListener("click", () => {
      if (state.fcIndex > 0) {
        state.fcIndex--;
        state.fcFlipped = false;
        renderFlashcards();
      }
    });
    $("#fc-next").addEventListener("click", () => {
      if (state.fcIndex < total - 1) {
        state.fcIndex++;
        state.fcFlipped = false;
        renderFlashcards();
      }
    });
    $("#fc-known").addEventListener("click", () => {
      setKnown(card.id, true);
      if (state.fcIndex < total - 1) {
        state.fcIndex++;
        state.fcFlipped = false;
      }
      renderFlashcards();
    });
    $("#fc-unknown").addEventListener("click", () => {
      setKnown(card.id, false);
      if (state.fcIndex < total - 1) {
        state.fcIndex++;
        state.fcFlipped = false;
      }
      renderFlashcards();
    });
    $("#fc-shuffle").addEventListener("click", () => {
      resetFlashcards(true);
      renderFlashcards();
    });
    $("#fc-flip").addEventListener("click", flipCard);
  }

  function flipCard() {
    state.fcFlipped = !state.fcFlipped;
    const fc = $("#flashcard");
    if (fc) fc.classList.toggle("flipped", state.fcFlipped);
  }

  /* ── Render: quiz ── */
  function renderQuiz() {
    const el = $("#view-quiz");
    const total = state.qzOrder.length;

    if (!total) {
      el.innerHTML = '<div class="empty-state">No quiz questions for this topic.</div>';
      return;
    }

    if (state.qzDone) {
      const pct = Math.round((state.qzCorrect / total) * 100);
      setQuizBest(state.topicFilter, state.qzCorrect);
      const best = getQuizBest(state.topicFilter);
      el.innerHTML = `
        <div class="quiz-done">
          <h2>Quiz complete</h2>
          <div class="big-score">${state.qzCorrect}/${total}</div>
          <p>${pct}% correct</p>
          <p class="best">Best for this filter: ${best}/${total}</p>
          <button type="button" class="btn btn-primary" id="qz-restart">Restart</button>
        </div>`;
      $("#qz-restart").addEventListener("click", () => {
        resetQuiz(true);
        renderQuiz();
      });
      return;
    }

    const q = currentQuestion();
    if (!q) {
      el.innerHTML = '<div class="empty-state">Question not found.</div>';
      return;
    }

    const topic = topicById(q.topicId);
    const best = getQuizBest(state.topicFilter);

    el.innerHTML = `
      <div class="quiz-header">
        <span>Question ${state.qzIndex + 1} of ${total}</span>
        <span>Score: <span class="quiz-score">${state.qzCorrect}</span> · Best: ${best}</span>
      </div>
      <div class="quiz-question-card">
        <div class="quiz-topic">${escapeHtml(topic ? topic.name : "")}</div>
        <div class="quiz-question">${escapeHtml(q.question)}</div>
        <div class="quiz-options" id="qz-options">
          ${q.options
            .map((opt, i) => {
              let cls = "quiz-option";
              if (state.qzAnswered) {
                if (i === q.correctIndex) cls += " correct";
                else if (i === state.qzSelected) cls += " wrong";
              }
              return `<button type="button" class="${cls}" data-idx="${i}" ${state.qzAnswered ? "disabled" : ""}>${escapeHtml(opt)}</button>`;
            })
            .join("")}
        </div>
        <div class="quiz-explanation${state.qzAnswered && q.explanation ? " visible" : ""}" id="qz-explain">
          ${state.qzAnswered && q.explanation ? escapeHtml(q.explanation) : ""}
        </div>
      </div>
      <div class="quiz-actions">
        ${
          state.qzAnswered
            ? `<button type="button" class="btn btn-primary" id="qz-next">${state.qzIndex >= total - 1 ? "See results" : "Next question"}</button>`
            : ""
        }
        <button type="button" class="btn btn-ghost" id="qz-restart">Restart</button>
      </div>`;

    if (!state.qzAnswered) {
      $$("#qz-options .quiz-option").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.idx);
          state.qzSelected = idx;
          state.qzAnswered = true;
          if (idx === q.correctIndex) state.qzCorrect++;
          renderQuiz();
        });
      });
    }

    const nextBtn = $("#qz-next");
    if (nextBtn) {
      nextBtn.addEventListener("click", () => {
        if (state.qzIndex >= total - 1) {
          state.qzDone = true;
        } else {
          state.qzIndex++;
          state.qzAnswered = false;
          state.qzSelected = null;
        }
        renderQuiz();
      });
    }

    $("#qz-restart").addEventListener("click", () => {
      resetQuiz(true);
      renderQuiz();
    });
  }

  /* ── Escape ── */
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /* ── View switching ── */
  function setView(view) {
    state.view = view;
    $$(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
    $$(".view").forEach((v) => v.classList.toggle("active", v.id === "view-" + view));
    renderCurrent();
  }

  function renderCurrent() {
    renderChips();
    if (state.view === "concepts") renderConcepts();
    else if (state.view === "flashcards") renderFlashcards();
    else if (state.view === "quiz") renderQuiz();
  }

  function onTopicChange(topicId) {
    state.topicFilter = topicId;
    if (state.view === "flashcards") resetFlashcards(false);
    if (state.view === "quiz") resetQuiz(true);
    renderCurrent();
  }

  /* ── Boot ── */
  function init() {
    const app = $("#app");
    if (!app) return;

    const knownTotal = data.flashcards.filter((c) => isKnown(c.id)).length;
    $("#header-meta").textContent = `${data.flashcards.length} cards · ${data.quiz.length} questions · ${knownTotal} known`;

    $$(".nav-btn").forEach((btn) => {
      btn.addEventListener("click", () => setView(btn.dataset.view));
    });

    $("#filters").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (chip) onTopicChange(chip.dataset.topic);
    });

    resetFlashcards(false);
    resetQuiz(true);
    setView("concepts");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
